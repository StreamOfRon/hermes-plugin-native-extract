[project]
name = "hermes-plugin-native-extract"
version = "0.1.1"
description = "Hermes plugin for native web content extraction"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "html-to-markdown",
]

# Plugin distribution uses a hybrid venv layout, so the module id (derived from
# the dir name) keeps its hyphens; N999 is inherent to the distribution format.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
